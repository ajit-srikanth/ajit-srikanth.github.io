<body>

  <!-- Fixed top accent strip -->
  <div class="top-strip"></div>

  <!-- Sticky Glassmorphism Navbar -->
  <nav class="navbar">
    <div class="wrapper">
      <a href="#" class="nav-brand" onclick="showPage('home'); return false;">Ajit Srikanth</a>
      <ul class="nav-items">
        <li><a href="#" id="nav-home" class="active" onclick="showPage('home'); return false;">Home</a></li>
        <li><a href="#" id="nav-research" onclick="showPage('research'); return false;">Research & More</a></li>
        <li style="position:relative;">
          <button class="theme-btn" onclick="cycleTheme()" title="Change theme" aria-label="Change color theme"
            id="theme-btn">🎾</button>
          <span class="theme-name" id="theme-name"></span>
        </li>
      </ul>
    </div>
  </nav>

  <main class="wrapper">

    


    <!-- Footer -->
    <footer class="site-footer">
      <p style="font-size: 0.85rem; font-style: italic; color: var(--text-muted); text-align: center;">
        **under development (both me and the website)
      </p>
    </footer>

  </main>

  <!-- AOS Library -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

  <!-- ═══════════════════════════════════════
       JAVASCRIPT
       ═══════════════════════════════════════ -->
  <script>
    // ────────────────────────────────────────
    // THEME SYSTEM
    // 8 sport themes — just CSS variable swaps
    // ────────────────────────────────────────
    var THEMES = [
      {
        name: 'Tennis',
        icon: '🎾',
        primary: '#2d6a4f', primaryLight: '#40916c', primaryDark: '#1b4332',
        accent: '#d4a843', accentLight: '#e8c96a', accentDim: 'rgba(212,168,67,0.12)',
        ghost: 'rgba(45,106,79,0.06)', ghostStrong: 'rgba(45,106,79,0.12)',
        strip: 'linear-gradient(90deg,#1b4332,#2d6a4f,#40916c,#2d6a4f,#1b4332)'
      },
      {
        name: 'Swimming',
        icon: '🏊',
        primary: '#1565c0', primaryLight: '#42a5f5', primaryDark: '#0d47a1',
        accent: '#4fc3f7', accentLight: '#81d4fa', accentDim: 'rgba(79,195,247,0.12)',
        ghost: 'rgba(21,101,192,0.06)', ghostStrong: 'rgba(21,101,192,0.12)',
        strip: 'linear-gradient(90deg,#0d47a1,#1565c0,#42a5f5,#1565c0,#0d47a1)'
      },
      {
        name: 'Cricket',
        icon: '🏏',
        primary: '#6d4c2e', primaryLight: '#8d6e4b', primaryDark: '#3e2723',
        accent: '#c8a96e', accentLight: '#d4b98a', accentDim: 'rgba(200,169,110,0.12)',
        ghost: 'rgba(109,76,46,0.06)', ghostStrong: 'rgba(109,76,46,0.12)',
        strip: 'linear-gradient(90deg,#3e2723,#6d4c2e,#8d6e4b,#6d4c2e,#3e2723)'
      },
      {
        name: 'Basketball',
        icon: '🏀',
        primary: '#bf5700', primaryLight: '#e07020', primaryDark: '#8b3e00',
        accent: '#f5a623', accentLight: '#ffc857', accentDim: 'rgba(245,166,35,0.12)',
        ghost: 'rgba(191,87,0,0.06)', ghostStrong: 'rgba(191,87,0,0.12)',
        strip: 'linear-gradient(90deg,#8b3e00,#bf5700,#e07020,#bf5700,#8b3e00)'
      },
      {
        name: 'Table Tennis',
        icon: '🏓',
        primary: '#283593', primaryLight: '#3f51b5', primaryDark: '#1a237e',
        accent: '#ef5350', accentLight: '#ff7961', accentDim: 'rgba(239,83,80,0.12)',
        ghost: 'rgba(40,53,147,0.06)', ghostStrong: 'rgba(40,53,147,0.12)',
        strip: 'linear-gradient(90deg,#1a237e,#283593,#3f51b5,#283593,#1a237e)'
      },
      {
        name: 'Volleyball',
        icon: '🏐',
        primary: '#00838f', primaryLight: '#00acc1', primaryDark: '#006064',
        accent: '#f9a825', accentLight: '#fdd835', accentDim: 'rgba(249,168,37,0.12)',
        ghost: 'rgba(0,131,143,0.06)', ghostStrong: 'rgba(0,131,143,0.12)',
        strip: 'linear-gradient(90deg,#006064,#00838f,#00acc1,#00838f,#006064)'
      },
      {
        name: 'Badminton',
        icon: '🏸',
        primary: '#00695c', primaryLight: '#00897b', primaryDark: '#004d40',
        accent: '#b0bec5', accentLight: '#cfd8dc', accentDim: 'rgba(176,190,197,0.15)',
        ghost: 'rgba(0,105,92,0.06)', ghostStrong: 'rgba(0,105,92,0.12)',
        strip: 'linear-gradient(90deg,#004d40,#00695c,#00897b,#00695c,#004d40)'
      },
      {
        name: 'Football',
        icon: '⚽',
        primary: '#2e7d32', primaryLight: '#43a047', primaryDark: '#1b5e20',
        accent: '#e0e0e0', accentLight: '#f5f5f5', accentDim: 'rgba(224,224,224,0.18)',
        ghost: 'rgba(46,125,50,0.06)', ghostStrong: 'rgba(46,125,50,0.12)',
        strip: 'linear-gradient(90deg,#1b5e20,#2e7d32,#43a047,#2e7d32,#1b5e20)'
      }
    ];

    function applyTheme(t) {
      var r = document.documentElement.style;
      r.setProperty('--primary', t.primary);
      r.setProperty('--primary-light', t.primaryLight);
      r.setProperty('--primary-dark', t.primaryDark);
      r.setProperty('--accent', t.accent);
      r.setProperty('--accent-light', t.accentLight);
      r.setProperty('--accent-dim', t.accentDim);
      r.setProperty('--primary-ghost', t.ghost);
      r.setProperty('--primary-ghost-strong', t.ghostStrong);
      r.setProperty('--strip-gradient', t.strip);

      var btn = document.getElementById('theme-btn');
      if (btn) btn.textContent = t.icon;

      // Theme name tooltip flashing removed as requested
    }

    function initTheme() {
      var saved = sessionStorage.getItem('ti');
      var idx = saved !== null ? parseInt(saved, 10) : Math.floor(Math.random() * THEMES.length);
      sessionStorage.setItem('ti', idx);
      applyTheme(THEMES[idx]);
    }

    function cycleTheme() {
      var cur = parseInt(sessionStorage.getItem('ti') || '0', 10);
      var next = (cur + 1) % THEMES.length;
      sessionStorage.setItem('ti', next);
      applyTheme(THEMES[next]);
    }


    // ────────────────────────────────────────
    // PAGE SWITCHING (Home ↔ Research & More)
    // ────────────────────────────────────────
    function showPage(page) {
      // Hide all pages
      document.querySelectorAll('.page').forEach(function (el) { el.classList.remove('active'); });
      document.querySelectorAll('.nav-items a[id]').forEach(function (el) { el.classList.remove('active'); });

      if (page === 'home') {
        document.getElementById('page-home').classList.add('active');
        document.getElementById('nav-home').classList.add('active');
      } else {
        document.getElementById('page-research').classList.add('active');
        document.getElementById('nav-research').classList.add('active');
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      history.replaceState(null, '', page === 'home' ? window.location.pathname : '#research');

      // Re-trigger AOS for newly visible elements
      setTimeout(function () { AOS.refresh(); }, 100);
    }


    // ────────────────────────────────────────
    // MODALS & COMPONENTS
    // ────────────────────────────────────────
    function openModal(id) {
      document.getElementById('modal-' + id).classList.add('active');
      document.body.style.overflow = 'hidden'; // Prevent background scrolling
    }

    function closeModal(id) {
      document.getElementById('modal-' + id).classList.remove('active');
      document.body.style.overflow = '';
    }

    // Close modal if clicked outside of modal content
    window.onclick = function(event) {
      if (event.target.classList.contains('modal-overlay')) {
        event.target.classList.remove('active');
        document.body.style.overflow = '';
      }
    };

    function toggleProj(event, element) {
      // Don't toggle if a link was clicked
      if (event.target.tagName.toLowerCase() === 'a') return;
      element.classList.toggle('open');
    }

    function toggleViewMore(btn) {
      var grid = btn.closest('.proj-section').querySelector('.proj-grid');
      var hiddenItems = grid.querySelectorAll('.proj-card.hidden-item');
      var isExpanded = btn.getAttribute('data-expanded') === 'true';
      
      if (!isExpanded) {
        hiddenItems.forEach(item => item.style.display = 'flex');
        btn.innerHTML = 'Show Less <i data-feather="chevron-up"></i>';
        btn.setAttribute('data-expanded', 'true');
      } else {
        hiddenItems.forEach(item => item.style.display = 'none');
        btn.innerHTML = 'View More <i data-feather="chevron-down"></i>';
        btn.setAttribute('data-expanded', 'false');
      }
      if (window.feather) feather.replace();
    }


    // ────────────────────────────────────────
    // INIT
    // ────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
      // Apply theme
      initTheme();

      // Initialize AOS
      AOS.init({
        once: true,       // Animate only once
        offset: 60,
        easing: 'ease-out-cubic'
      });

      // Render Feather icons
      if (window.feather) feather.replace();

      // Check hash
      if (window.location.hash === '#research') {
        showPage('research');
      }
    });
  </script>

</body>

</html>
