    function applyTheme(t) {
      var r = document.documentElement.style;
      r.setProperty('--primary', t.primary);
      r.setProperty('--primary-light', t.primaryLight);
      r.setProperty('--primary-dark', t.primaryDark);
      r.setProperty('--accent', t.accent);
      r.setProperty('--accent-light', t.accentLight);
      r.setProperty('--accent-dim', t.accentDim);
      r.setProperty('--primary-ghost', t.ghost);
      r.setProperty('--primary-ghost-strong', t.ghostStrong);
      r.setProperty('--strip-gradient', t.strip);
      
      // New background court variables
      r.setProperty('--court-base', t.courtBase);
      r.setProperty('--court-lines', t.courtLines);
      r.setProperty('--court-size', t.courtSize);
      r.setProperty('--page-bg', t.pageBg);
      r.setProperty('--bg-card', t.cardBg);

      var btn = document.getElementById('theme-btn');
      if (btn) btn.textContent = t.icon;
      
      var sIcon = document.getElementById('scroll-indicator-icon');
      if (sIcon) sIcon.textContent = t.scrollIcon;
    }

    var currentThemeIdx = 0;

    function initTheme() {
      // Always start with Tennis (0) on page load
      currentThemeIdx = 0;
      applyTheme(THEMES[currentThemeIdx]);
    }

    function toggleTheme() {
      currentThemeIdx = currentThemeIdx === 0 ? 1 : 0; // Toggle between 0 (Tennis) and 1 (Robotics)
      applyThemeFromIndex(currentThemeIdx);
    }

    function applyThemeFromIndex(idx) {
      sessionStorage.setItem('ti', idx);
      applyTheme(THEMES[idx]);
    }


    // ────────────────────────────────────────
    // PAGE SWITCHING (Home ↔ Research & More)
    // ────────────────────────────────────────
    function showPage(page) {
      // Hide all pages
      document.querySelectorAll('.page').forEach(function (el) { el.classList.remove('active'); });
      document.querySelectorAll('.nav-items a[id]').forEach(function (el) { el.classList.remove('active'); });

      if (page === 'home') {
        document.getElementById('page-home').classList.add('active');
        document.getElementById('nav-home').classList.add('active');
      } else {
        document.getElementById('page-research').classList.add('active');
        document.getElementById('nav-research').classList.add('active');
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
      history.replaceState(null, '', page === 'home' ? window.location.pathname : '#research');

      // Re-trigger AOS for newly visible elements
      setTimeout(function () { AOS.refresh(); }, 100);
    }


    // ────────────────────────────────────────
    // MODALS & COMPONENTS
    // ────────────────────────────────────────
    function openModal(id) {
      document.getElementById('modal-' + id).classList.add('active');
      document.body.style.overflow = 'hidden'; // Prevent background scrolling
    }

    function closeModal(id) {
      document.getElementById('modal-' + id).classList.remove('active');
      document.body.style.overflow = '';
    }

    // Close modal if clicked outside of modal content
    window.onclick = function(event) {
      if (event.target.classList.contains('modal-overlay')) {
        event.target.classList.remove('active');
        document.body.style.overflow = '';
      }
    };

    function toggleProj(event, element) {
      // Don't toggle if a link was clicked
      if (event.target.tagName.toLowerCase() === 'a') return;
      element.classList.toggle('open');
    }

    function toggleViewMore(btn) {
      var grid = btn.closest('.proj-section').querySelector('.proj-grid');
      var hiddenItems = grid.querySelectorAll('.proj-card.hidden-item');
      var isExpanded = btn.getAttribute('data-expanded') === 'true';
      
      if (!isExpanded) {
        hiddenItems.forEach(item => item.style.display = 'flex');
        btn.innerHTML = 'Show Less <i data-feather="chevron-up"></i>';
        btn.setAttribute('data-expanded', 'true');
      } else {
        hiddenItems.forEach(item => item.style.display = 'none');
        btn.innerHTML = 'View More <i data-feather="chevron-down"></i>';
        btn.setAttribute('data-expanded', 'false');
      }
      if (window.feather) feather.replace();
    }


    // ────────────────────────────────────────
    // INIT
    // ────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
      // Apply theme
      initTheme();

      // Initialize AOS
      AOS.init({
        once: true,       // Animate only once
        offset: 60,
        easing: 'ease-out-cubic'
      });

      // Render Feather icons
      if (window.feather) feather.replace();

      // Check hash
      if (window.location.hash === '#research') {
        showPage('research');
      }

      // SCROLL INDICATOR LOGIC
      window.addEventListener('scroll', function() {
        var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
        var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
        var scrolled = (winScroll / height) * 100;
        var bar = document.getElementById('scroll-progress-bar');
        if(bar) bar.style.width = scrolled + '%';
      });
    });
  </script>
